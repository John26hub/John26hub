<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <defs>
    <style>
      .box { fill: #1e1e2e; stroke: #89b4fa; stroke-width: 2; rx: 10; }
      .core-box { fill: #1e1e2e; stroke: #f38ba8; stroke-width: 3; rx: 15; }
      .text { font-family: 'Segoe UI', system-ui, sans-serif; fill: #cdd6f4; font-size: 16px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .subtext { font-family: 'Segoe UI', system-ui, sans-serif; fill: #bac2de; font-size: 14px; text-anchor: middle; dominant-baseline: middle; }
      .title { font-size: 22px; fill: #89b4fa; font-weight: 800; }
      .flow { stroke: #a6e3a1; stroke-width: 4; stroke-dasharray: 12 12; fill: none; animation: dash 1.5s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      .bg { fill: #00000000; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="400" y="40" class="text title">🚀 Architecture Blueprint</text>

  <!-- Android Box -->
  <rect x="50" y="100" width="200" height="70" class="box" />
  <text x="150" y="135" class="text">📱 Android APK</text>

  <!-- Browser Box -->
  <rect x="50" y="240" width="200" height="70" class="box" />
  <text x="150" y="275" class="text">💻 Web Browser</text>

  <!-- Core Box -->
  <rect x="480" y="90" width="280" height="230" class="core-box" />
  <text x="620" y="130" class="text" style="fill: #f38ba8; font-size: 20px;">🌐 Core Application</text>
  
  <rect x="500" y="160" width="240" height="35" rx="5" fill="#313244" />
  <text x="620" y="177" class="subtext">📍 Interactive Pandal Map</text>

  <rect x="500" y="205" width="240" height="35" rx="5" fill="#313244" />
  <text x="620" y="222" class="subtext">🔐 Dual Google Auth</text>

  <rect x="500" y="250" width="240" height="35" rx="5" fill="#313244" />
  <text x="620" y="267" class="subtext">🎵 Audio &amp; Offline Save</text>

  <!-- Animated Data Flows -->
  <path d="M 250 135 C 350 135, 400 205, 480 205" class="flow" />
  <path d="M 250 275 C 350 275, 400 205, 480 205" class="flow" />
</svg>
